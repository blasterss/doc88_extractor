[project]
name = "doc88-extractor"
version = "2.2.1"
description = "Инструмент для извлечения предпросмотра документов DOC88 в PDF"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "curl-cffi>=0.16.0",
    "requests>=2.34.2",
    "retrying>=1.4.2",
    "ruff>=0.16.2",
    "xmltodict>=1.0.4",
]

[project.scripts]
doc88-extractor = "doc88_extractor.presentation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc88_extractor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
