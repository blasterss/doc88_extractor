<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOC88 Extractor</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 680px; margin: 10vh auto; padding: 0 20px; color: #222; }
    form { display: grid; gap: 12px; }
    textarea { min-height: 120px; padding: 12px; font: inherit; }
    label { display: flex; gap: 8px; align-items: center; }
    button { width: fit-content; padding: 10px 18px; cursor: pointer; }
    #status { margin-top: 24px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>DOC88 Extractor</h1>
  <p>Введите ссылку DOC88, ID документа или строку <code>m_main</code>.</p>
  <form id="form">
    <textarea name="value" required placeholder="https://www.doc88.com/p-12345678.html"></textarea>
    <label><input type="checkbox" name="image_pdf" value="true"> Взять как image pdf</label>
    <button type="submit">Извлечь PDF</button>
  </form>
  <div id="status" role="status"></div>
  <script>
    const form = document.querySelector('#form');
    const status = document.querySelector('#status');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = 'Создание задания…';
      const response = await fetch('/api/jobs', { method: 'POST', body: new FormData(form) });
      const job = await response.json();
      if (!response.ok) { status.textContent = job.detail || 'Ошибка'; return; }
      const timer = setInterval(async () => {
        const current = await (await fetch(`/api/jobs/${job.id}`)).json();
        status.textContent = current.message;
        if (current.status === 'completed') {
          clearInterval(timer);
          status.innerHTML = `<a href="${current.download_url}">Скачать PDF</a>`;
        } else if (current.status === 'failed') clearInterval(timer);
      }, 1500);
    });
  </script>
</body>
</html>
