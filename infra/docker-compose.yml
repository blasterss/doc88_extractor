services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - doc88-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  doc88-data:
