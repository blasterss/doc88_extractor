services:
  doc88-service:
    build:
      context: ..
      dockerfile: infra/doc88.Dockerfile
    restart: unless-stopped
    volumes:
      - doc88-data:/app/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  doc88-data:
